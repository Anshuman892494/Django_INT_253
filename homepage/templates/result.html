{% extends 'base.html' %}

{% block title %}Result{% endblock %}

{% block content %}
<h1>Result Page</h1>
<p>Name : {{name}}</p>
<p>Marks : {{marks}}</p>

{% if marks >= 80 %}
<p>Grade : A</p>
{% elif marks >= 60 %}
<p>Grade : B</p>
{% elif marks >= 40 %}
<p>Grade : C</p>
{% else %}
<p>Grade : F</p>
{% endif %}
{% endblock %}
